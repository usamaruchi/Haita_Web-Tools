<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="海獺君的個人工具收藏。搜尋、分類與管理常用的網頁開發資源。"><title>海獺君的工具收藏</title><link rel="icon" href="favicon.ico?v=otter-1" sizes="16x16 32x32 48x48"><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=otter-1"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand intro" href="./" aria-label="海獺君的工具收藏首頁"><h1>海獺君的<span>工具收藏</span></h1><img class="otter-mascot" src="assets/otter-face-reference.png" alt="微笑的 Q 版海獺臉" width="48" height="48"><div class="stats"><span><strong id="total">100</strong> 個收藏工具</span><i></i><span><strong id="category-total">21</strong> 個工具分類</span></div></a><p class="nav-label">我的工作空間</p><button class="nav-main active" id="all"><span>▦</span> 所有工具 <b id="side-count">100</b></button><button class="nav-main" id="favorites"><span>☆</span> 我的最愛 <b id="favorite-count">0</b></button><p class="nav-label category-label">依用途探索 <span id="nav-category-total">21</span></p><nav id="categories" aria-label="工具分類"></nav><div class="sidebar-bottom"><span class="save-dot" aria-hidden="true"></span> 最後更新<p><time id="site-updated" datetime="2026-11-10">2026.11.10</time></p></div></aside>
<main><header><div class="breadcrumb">我的工作空間 <span>/</span> 工具收藏</div><div class="header-actions"><button class="quiet" id="import">↥ 匯入</button><button class="quiet" id="export">↧ 匯出備份</button><button class="primary" id="add">＋ 新增工具</button></div></header>
<section class="workspace"><div class="search-row"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="7.1"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜尋工具名稱、功能或標籤…" aria-label="搜尋工具"><kbd>/</kbd></label><label class="sort-label">排序 <select id="sort" aria-label="排序方式"><option value="original">原始順序</option><option value="name">名稱 A → Z</option><option value="newest">最新加入</option></select></label></div><div class="filter-row"><div id="chips" class="chips"></div></div><div class="results-heading"><div><h2 id="view-title">所有工具</h2><span id="result-count"></span></div><span class="view-hint">▦ 卡片檢視</span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><span>⌕</span><h3>沒有找到符合的工具</h3><p>試試其他關鍵字，或新增你的第一個收藏。</p><button id="clear" class="quiet">清除篩選</button></div><footer><span>HAITA / TOOL COLLECTION</span><span>資料儲存在目前瀏覽器，記得定期匯出備份。</span></footer></section></main>
<dialog id="editor"><form id="tool-form"><div class="dialog-heading"><div><span class="eyebrow">CURATE YOUR TOOLKIT</span><h2 id="dialog-title">新增工具</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="關閉">✕</button></div><input type="hidden" id="tool-id"><label>工具名稱<input id="tool-name" required maxlength="100" placeholder="例如：Swiper"></label><label>網站網址<input id="tool-url" type="url" required maxlength="2000" placeholder="https://..."></label><label>用途分類<select id="tool-category"></select></label><label>功能簡介<textarea id="tool-description" required maxlength="1000" rows="3" placeholder="簡單記錄它能幫你做什麼…"></textarea></label><label>標籤 <small>以逗號分隔</small><input id="tool-tags" maxlength="200" placeholder="JavaScript, 輪播, 觸控"></label><label class="check-label"><input type="checkbox" id="tool-favorite"> 加入我的最愛</label><div class="dialog-actions"><button id="delete-tool" type="button" class="danger">刪除工具</button><div><button type="button" id="cancel" class="quiet">取消</button><button type="submit" class="primary">儲存工具</button></div></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title">確認操作</h2><p id="confirm-text"></p><div class="confirm-actions"><button id="confirm-cancel" class="quiet">取消</button><button id="confirm-ok" class="primary">確認</button></div></dialog><input type="file" id="import-file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
